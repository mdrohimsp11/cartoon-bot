name: Bangla news

on:
  schedule:
    - cron: "5 22,4,10,16 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Type yes to post on Facebook. Leave no for a safe test."
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: bangla-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonts and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PUBLISH: ${{ github.event.inputs.publish }}
          MAX_NEWS: "4"
        run: python news_bot.py

      - name: Remember posted news
        if: always()
        run: |
          if [ -f posted.json ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add posted.json
            git diff --cached --quiet || (git commit -m "Update posted list" && git push)
          fi

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-pack
          path: |
            news_out/*.jpg
            news_out/*.mp4
            news_out/posts.json
          retention-days: 7
