name: Make cartoon video

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cartoon_bot.py

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-video
          path: |
            output/video.mp4
            output/thumbnail.jpg
            output/thumbnail_wide.jpg
            output/meta.json
          retention-days: 7
